<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .myparent {
            display: flex;
        }
        .myparent .left{
            color: white;
            background-color: red;
            width: 10%;
            margin-right: 10px;
        }
        .myparent .center1{
            color: white;
            background-color: green;
            width: 30%;
            margin-right: 10px;
        }
        .myparent .center2{
            color: white;
            background-color: rgb(69, 16, 218);
            width: 30%;
            margin-right: 10px;
        }
        .myparent .right{
            color: white;
            background-color: blue;
            width: 10%;
        }
        .myparent2 {
            display: flex;
        }
        .myparent2 .left{
            color: white;
            background-color: red;
            width: 10%;
            margin-right: 10px;
        }
        .myparent2 .center1{
            color: white;
            background-color: green;
            width: 30%;
            margin-right: 10px;
        }
        .myparent2 .center2{
            color: white;
            background-color: rgb(69, 16, 218);
            width: 30%;
            margin-right: 10px;
        }
        .myparent2 .right{
            color: white;
            background-color: blue;
            width: 10%;
        }
    </style>
</head>
<body>
    <section class="myparent">
        <div class="left">div1</div>
        <div class="center1">div2</div>
        <div class="center2">div3</div>
        <div class="right">div4</div>
    </section>
    <section class="myparent2">
        <div class="left">div1</div>
        <div class="center1">div2</div>
        <div class="center2">div3</div>
        <div class="right">div4</div>
    </section>
</body>
</html>
