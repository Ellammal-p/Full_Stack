<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration</h1>
    Name:<input type="text" placeholder="Enter your name"/><br>
    Email:<input type="email" placeholder="Enter your email"/><br>
    Password:<input type="password" placeholder="Enter your password"/><br>
    Date of Birth:<input type="date" placeholder="Enter your date of birth"/><br>
    Gender:
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other<br>
    <textarea placeholder="Enter your address..."></textarea><br>
    <input type="submit" value="Register"/><br>
</body>
</html>
